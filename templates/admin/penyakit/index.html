{{ define "admin_penyakit_index.html" }}
<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{ .title }}</title>

    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="/static/css/custom.css">
</head>
<body class="min-h-screen bg-slate-100">

    <nav class="bg-white border-b border-slate-200 sticky top-0 z-50">
        <div class="max-w-7xl mx-auto px-6 py-4 flex justify-between items-center">
            <div>
                <h1 class="text-xl font-bold text-slate-800">Sistem Pakar Dada</h1>
                <p class="text-sm text-slate-500">Kelola Data Penyakit</p>
            </div>

            <div class="flex items-center gap-4">
                <a href="/admin/dashboard" class="text-sm font-semibold text-blue-600 hover:underline">Dashboard</a>

                <div class="text-right">
                    <p id="adminName" class="text-sm font-semibold text-slate-700">Admin</p>
                    <p id="adminRole" class="text-xs text-slate-500">role</p>
                </div>

                <button onclick="logout()" class="bg-red-500 hover:bg-red-600 text-white px-4 py-2 rounded-xl text-sm font-semibold">
                    Logout
                </button>
            </div>
        </div>
    </nav>

    <main class="max-w-7xl mx-auto px-6 py-8">
        <section class="mb-6 flex flex-col md:flex-row md:items-center md:justify-between gap-4">
            <div>
                <h2 class="text-2xl font-bold text-slate-800">Data Penyakit</h2>
                <p class="text-slate-500 mt-1">Tambah, edit, dan hapus data penyakit dada.</p>
            </div>

            <a href="/admin/penyakit/create" class="bg-blue-600 hover:bg-blue-700 text-white px-5 py-3 rounded-xl font-semibold">
                + Tambah Penyakit
            </a>
        </section>

        <div id="alertBox" class="hidden mb-4 rounded-lg px-4 py-3 text-sm"></div>

        <section class="bg-white rounded-2xl shadow overflow-hidden">
            <div class="overflow-x-auto">
                <table class="w-full text-sm">
                    <thead class="bg-slate-50 border-b border-slate-200">
                        <tr>
                            <th class="px-6 py-4 text-left font-semibold text-slate-600">No</th>
                            <th class="px-6 py-4 text-left font-semibold text-slate-600">Kode</th>
                            <th class="px-6 py-4 text-left font-semibold text-slate-600">Nama Penyakit</th>
                            <th class="px-6 py-4 text-left font-semibold text-slate-600">Deskripsi</th>
                            <th class="px-6 py-4 text-left font-semibold text-slate-600">Solusi</th>
                            <th class="px-6 py-4 text-right font-semibold text-slate-600">Aksi</th>
                        </tr>
                    </thead>
                    <tbody id="penyakitTableBody" class="divide-y divide-slate-100">
                        <tr>
                            <td colspan="6" class="px-6 py-6 text-center text-slate-500">
                                Memuat data...
                            </td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </section>
    </main>

    <script>
        const token = localStorage.getItem("token");
        const user = JSON.parse(localStorage.getItem("user") || "null");

        const tableBody = document.getElementById("penyakitTableBody");
        const alertBox = document.getElementById("alertBox");

        if (!token || !user) {
            window.location.href = "/login-page";
        }

        if (user.role !== "admin" && user.role !== "pakar") {
            window.location.href = "/user/dashboard";
        }

        document.getElementById("adminName").textContent = user.nama;
        document.getElementById("adminRole").textContent = user.role;

        function logout() {
            localStorage.removeItem("token");
            localStorage.removeItem("user");
            window.location.href = "/login-page";
        }

        function showAlert(message, type = "success") {
            alertBox.classList.remove("hidden");
            alertBox.textContent = message;

            if (type === "success") {
                alertBox.className = "mb-4 rounded-lg px-4 py-3 text-sm bg-green-100 text-green-700";
            } else {
                alertBox.className = "mb-4 rounded-lg px-4 py-3 text-sm bg-red-100 text-red-700";
            }

            setTimeout(() => {
                alertBox.classList.add("hidden");
            }, 3000);
        }

        function escapeHTML(text) {
            if (!text) return "";
            return text
                .replace(/&/g, "&amp;")
                .replace(/</g, "&lt;")
                .replace(/>/g, "&gt;")
                .replace(/"/g, "&quot;")
                .replace(/'/g, "&#039;");
        }

        function limitText(text, max = 80) {
            if (!text) return "-";
            return text.length > max ? text.substring(0, max) + "..." : text;
        }

        async function loadPenyakit() {
            try {
                const response = await fetch("/penyakit");
                const result = await response.json();

                if (!response.ok) {
                    tableBody.innerHTML = `
                        <tr>
                            <td colspan="6" class="px-6 py-6 text-center text-red-500">
                                ${result.message || "Gagal mengambil data penyakit"}
                            </td>
                        </tr>
                    `;
                    return;
                }

                if (!result.data || result.data.length === 0) {
                    tableBody.innerHTML = `
                        <tr>
                            <td colspan="6" class="px-6 py-6 text-center text-slate-500">
                                Belum ada data penyakit
                            </td>
                        </tr>
                    `;
                    return;
                }

                tableBody.innerHTML = result.data.map((item, index) => {
                    const nama = escapeHTML(item.nama_penyakit);
                    const deskripsi = escapeHTML(limitText(item.deskripsi));
                    const solusi = escapeHTML(limitText(item.solusi));

                    return `
                        <tr class="hover:bg-slate-50 align-top">
                            <td class="px-6 py-4 text-slate-600">${index + 1}</td>
                            <td class="px-6 py-4 font-semibold text-slate-800">${item.kode_penyakit}</td>
                            <td class="px-6 py-4 text-slate-700 font-medium">${nama}</td>
                            <td class="px-6 py-4 text-slate-600 max-w-xs">${deskripsi}</td>
                            <td class="px-6 py-4 text-slate-600 max-w-xs">${solusi}</td>
                            <td class="px-6 py-4 text-right whitespace-nowrap">
                                <a
                                    href="/admin/penyakit/edit/${item.kode_penyakit}"
                                    class="bg-yellow-400 hover:bg-yellow-500 text-white px-3 py-2 rounded-lg text-xs font-semibold">
                                    Edit
                                </a>

                                <button
                                    onclick="deletePenyakit('${item.kode_penyakit}')"
                                    class="bg-red-500 hover:bg-red-600 text-white px-3 py-2 rounded-lg text-xs font-semibold ml-2">
                                    Hapus
                                </button>
                            </td>
                        </tr>
                    `;
                }).join("");

            } catch (error) {
                tableBody.innerHTML = `
                    <tr>
                        <td colspan="6" class="px-6 py-6 text-center text-red-500">
                            Terjadi kesalahan koneksi ke server
                        </td>
                    </tr>
                `;
            }
        }

        async function deletePenyakit(kode) {
            const confirmDelete = confirm(`Yakin ingin menghapus penyakit ${kode}?`);
            if (!confirmDelete) return;

            try {
                const response = await fetch(`/penyakit/${kode}`, {
                    method: "DELETE",
                    headers: {
                        "Authorization": `Bearer ${token}`
                    }
                });

                const result = await response.json();

                if (!response.ok) {
                    showAlert(result.message || "Gagal menghapus data penyakit", "error");
                    return;
                }

                showAlert(result.message || "Data penyakit berhasil dihapus");
                loadPenyakit();

            } catch (error) {
                showAlert("Terjadi kesalahan koneksi ke server", "error");
            }
        }

        loadPenyakit();
    </script>
</body>
</html>
{{ end }}
