{{ define "admin_gejala_create.html" }}
<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{ .title }}</title>

    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="/static/css/custom.css">
</head>
<body class="min-h-screen bg-slate-100">

    <nav class="bg-white border-b border-slate-200 sticky top-0 z-50">
        <div class="max-w-7xl mx-auto px-6 py-4 flex justify-between items-center">
            <div>
                <h1 class="text-xl font-bold text-slate-800">Sistem Pakar Dada</h1>
                <p class="text-sm text-slate-500">Tambah Data Gejala</p>
            </div>

            <div class="flex items-center gap-4">
                <a href="/admin/gejala" class="text-sm font-semibold text-blue-600 hover:underline">
                    Kembali
                </a>

                <div class="text-right">
                    <p id="adminName" class="text-sm font-semibold text-slate-700">Admin</p>
                    <p id="adminRole" class="text-xs text-slate-500">role</p>
                </div>

                <button onclick="logout()" class="bg-red-500 hover:bg-red-600 text-white px-4 py-2 rounded-xl text-sm font-semibold">
                    Logout
                </button>
            </div>
        </div>
    </nav>

    <main class="max-w-3xl mx-auto px-6 py-8">
        <section class="mb-6">
            <h2 class="text-2xl font-bold text-slate-800">Tambah Gejala</h2>
            <p class="text-slate-500 mt-1">Masukkan kode dan nama gejala baru.</p>
        </section>

        <div id="alertBox" class="hidden mb-4 rounded-lg px-4 py-3 text-sm"></div>

        <section class="bg-white rounded-2xl shadow p-6">
            <form id="createGejalaForm" class="space-y-5">
                <div>
                    <label class="block text-sm font-medium text-slate-700 mb-1">Kode Gejala</label>
                    <input
                        type="text"
                        id="kodeGejala"
                        class="w-full rounded-xl border border-slate-300 px-4 py-3 focus:outline-none focus:ring-2 focus:ring-blue-500"
                        placeholder="Contoh: G99"
                        required
                    >
                </div>

                <div>
                    <label class="block text-sm font-medium text-slate-700 mb-1">Nama Gejala</label>
                    <textarea
                        id="namaGejala"
                        rows="4"
                        class="w-full rounded-xl border border-slate-300 px-4 py-3 focus:outline-none focus:ring-2 focus:ring-blue-500"
                        placeholder="Masukkan nama gejala"
                        required
                    ></textarea>
                </div>

                <div class="flex justify-end gap-3">
                    <a href="/admin/gejala" class="px-4 py-2 rounded-xl border border-slate-300 text-slate-600 font-semibold">
                        Batal
                    </a>

                    <button type="submit" class="px-5 py-2 rounded-xl bg-blue-600 hover:bg-blue-700 text-white font-semibold">
                        Simpan
                    </button>
                </div>
            </form>
        </section>
    </main>

    <script>
        const token = localStorage.getItem("token");
        const user = JSON.parse(localStorage.getItem("user") || "null");

        if (!token || !user) {
            window.location.href = "/login-page";
        }

        if (user.role !== "admin" && user.role !== "pakar") {
            window.location.href = "/user/dashboard";
        }

        document.getElementById("adminName").textContent = user.nama;
        document.getElementById("adminRole").textContent = user.role;

        const form = document.getElementById("createGejalaForm");
        const alertBox = document.getElementById("alertBox");

        function showAlert(message, type = "error") {
            alertBox.classList.remove("hidden");
            alertBox.textContent = message;

            if (type === "success") {
                alertBox.className = "mb-4 rounded-lg px-4 py-3 text-sm bg-green-100 text-green-700";
            } else {
                alertBox.className = "mb-4 rounded-lg px-4 py-3 text-sm bg-red-100 text-red-700";
            }
        }

        function logout() {
            localStorage.removeItem("token");
            localStorage.removeItem("user");
            window.location.href = "/login-page";
        }

        form.addEventListener("submit", async function(e) {
            e.preventDefault();

            const kodeGejala = document.getElementById("kodeGejala").value.trim();
            const namaGejala = document.getElementById("namaGejala").value.trim();

            if (!kodeGejala || !namaGejala) {
                showAlert("Kode gejala dan nama gejala wajib diisi");
                return;
            }

            try {
                const response = await fetch("/gejala", {
                    method: "POST",
                    headers: {
                        "Content-Type": "application/json",
                        "Authorization": `Bearer ${token}`
                    },
                    body: JSON.stringify({
                        kode_gejala: kodeGejala,
                        nama_gejala: namaGejala
                    })
                });

                const result = await response.json();

                if (!response.ok) {
                    showAlert(result.message || "Gagal menambahkan data gejala");
                    return;
                }

                showAlert("Data gejala berhasil ditambahkan", "success");

                setTimeout(() => {
                    window.location.href = "/admin/gejala";
                }, 800);

            } catch (error) {
                showAlert("Terjadi kesalahan koneksi ke server");
            }
        });
    </script>
</body>
</html>
{{ end }}
