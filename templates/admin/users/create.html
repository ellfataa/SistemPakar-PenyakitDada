{{ define "admin_users_create.html" }}
<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{ .title }}</title>

    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="/static/css/custom.css">
</head>
<body class="min-h-screen bg-slate-100">

    <nav class="bg-white border-b border-slate-200 sticky top-0 z-50">
        <div class="max-w-7xl mx-auto px-6 py-4 flex justify-between items-center">
            <div>
                <h1 class="text-xl font-bold text-slate-800">Sistem Pakar Dada</h1>
                <p class="text-sm text-slate-500">Tambah User</p>
            </div>

            <div class="flex items-center gap-4">
                <a href="/admin/users" class="text-sm font-semibold text-blue-600 hover:underline">Manajemen User</a>
                <a href="/admin/dashboard" class="text-sm font-semibold text-blue-600 hover:underline">Dashboard</a>

                <div class="text-right">
                    <p id="adminName" class="text-sm font-semibold text-slate-700">Admin</p>
                    <p id="adminRole" class="text-xs text-slate-500">role</p>
                </div>

                <button onclick="logout()" class="bg-red-500 hover:bg-red-600 text-white px-4 py-2 rounded-xl text-sm font-semibold">
                    Logout
                </button>
            </div>
        </div>
    </nav>

    <main class="max-w-3xl mx-auto px-6 py-8">
        <section class="mb-6">
            <h2 class="text-2xl font-bold text-slate-800">Tambah User</h2>
            <p class="text-slate-500 mt-1">Tambahkan akun baru ke dalam sistem.</p>
        </section>

        <div id="alertBox" class="hidden mb-4 rounded-lg px-4 py-3 text-sm"></div>

        <section class="bg-white rounded-2xl shadow p-6">
            <form id="createUserForm" class="space-y-5">
                <div>
                    <label class="block text-sm font-medium text-slate-700 mb-1">Nama Lengkap</label>
                    <input
                        type="text"
                        id="nama"
                        class="w-full rounded-xl border border-slate-300 px-4 py-3 focus:outline-none focus:ring-2 focus:ring-blue-500"
                        placeholder="Masukkan nama lengkap"
                        required
                    >
                </div>

                <div>
                    <label class="block text-sm font-medium text-slate-700 mb-1">Username</label>
                    <input
                        type="text"
                        id="username"
                        class="w-full rounded-xl border border-slate-300 px-4 py-3 focus:outline-none focus:ring-2 focus:ring-blue-500"
                        placeholder="Masukkan username"
                        required
                    >
                </div>

                <div>
                    <label class="block text-sm font-medium text-slate-700 mb-1">Password</label>
                    <input
                        type="password"
                        id="password"
                        class="w-full rounded-xl border border-slate-300 px-4 py-3 focus:outline-none focus:ring-2 focus:ring-blue-500"
                        placeholder="Minimal 6 karakter"
                        required
                    >
                </div>

                <div>
                    <label class="block text-sm font-medium text-slate-700 mb-1">Role</label>
                    <select
                        id="role"
                        class="w-full rounded-xl border border-slate-300 px-4 py-3 bg-white focus:outline-none focus:ring-2 focus:ring-blue-500"
                        required>
                        <option value="">Pilih Role</option>
                        <option value="user">User/Pakar</option>
                        <option value="admin">Admin</option>
                    </select>
                </div>

                <div class="flex flex-col md:flex-row justify-end gap-3 pt-2">
                    <a href="/admin/users" class="text-center px-5 py-3 rounded-xl border border-slate-300 text-slate-600 font-semibold">
                        Batal
                    </a>

                    <button type="submit" class="px-5 py-3 rounded-xl bg-blue-600 hover:bg-blue-700 text-white font-semibold">
                        Simpan User
                    </button>
                </div>
            </form>
        </section>
    </main>

    <script>
        const token = localStorage.getItem("token");
        const user = JSON.parse(localStorage.getItem("user") || "null");

        const alertBox = document.getElementById("alertBox");
        const form = document.getElementById("createUserForm");

        if (!token || !user) {
            window.location.href = "/login-page";
        }

        if (user.role !== "admin") {
            window.location.href = "/user/dashboard";
        }

        document.getElementById("adminName").textContent = user.nama;
        document.getElementById("adminRole").textContent = user.role;

        function logout() {
            localStorage.removeItem("token");
            localStorage.removeItem("user");
            window.location.href = "/login-page";
        }

        function showAlert(message, type = "error") {
            alertBox.classList.remove("hidden");
            alertBox.textContent = message;

            if (type === "success") {
                alertBox.className = "mb-4 rounded-lg px-4 py-3 text-sm bg-green-100 text-green-700";
            } else {
                alertBox.className = "mb-4 rounded-lg px-4 py-3 text-sm bg-red-100 text-red-700";
            }
        }

        form.addEventListener("submit", async function(e) {
            e.preventDefault();

            const nama = document.getElementById("nama").value.trim();
            const username = document.getElementById("username").value.trim();
            const password = document.getElementById("password").value.trim();
            const role = document.getElementById("role").value;

            if (!nama || !username || !password || !role) {
                showAlert("Semua field wajib diisi");
                return;
            }

            if (password.length < 6) {
                showAlert("Password minimal 6 karakter");
                return;
            }

            try {
                const response = await fetch("/users", {
                    method: "POST",
                    headers: {
                        "Content-Type": "application/json",
                        "Authorization": `Bearer ${token}`
                    },
                    body: JSON.stringify({
                        nama: nama,
                        username: username,
                        password: password,
                        role: role
                    })
                });

                const result = await response.json();

                if (!response.ok) {
                    showAlert(result.message || "Gagal menambahkan user");
                    return;
                }

                showAlert("User berhasil ditambahkan", "success");

                setTimeout(() => {
                    window.location.href = "/admin/users";
                }, 800);

            } catch (error) {
                showAlert("Terjadi kesalahan koneksi ke server");
            }
        });
    </script>
</body>
</html>
{{ end }}
