<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{ .title }}</title>

    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="/static/css/custom.css">

    <style>
        html {
            scroll-behavior: smooth;
        }

        .login-image {
            background-image:
                linear-gradient(120deg, rgba(30, 15, 58, 0.84), rgba(131, 24, 67, 0.62)),
                url('/static/img/login.jpg');
            background-size: cover;
            background-position: center;
        }

        .auth-card {
            border: 1px solid rgba(226, 232, 240, 0.9);
            background: rgba(255, 255, 255, 0.98);
            box-shadow: 0 24px 80px rgba(15, 23, 42, 0.10);
        }

        .gradient-text {
            background: linear-gradient(135deg, #7c3aed, #ec4899);
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
        }

        .btn-gradient {
            background: linear-gradient(135deg, #7c3aed, #ec4899);
            color: white;
            transition: 0.2s ease;
        }

        .btn-gradient:hover {
            filter: brightness(0.96);
            transform: translateY(-1px);
            box-shadow: 0 14px 34px rgba(236, 72, 153, 0.28);
        }

        .soft-auth-bg {
            background:
                radial-gradient(circle at top left, rgba(168, 85, 247, 0.16), transparent 32%),
                radial-gradient(circle at bottom right, rgba(236, 72, 153, 0.14), transparent 34%),
                #f8fafc;
        }

        .glass-box {
            background: rgba(255, 255, 255, 0.12);
            border: 1px solid rgba(255, 255, 255, 0.18);
            backdrop-filter: blur(14px);
        }
    </style>
</head>

<body class="min-h-screen soft-auth-bg text-slate-800">

    <main class="min-h-screen flex items-center justify-center px-4 py-8">
        <section class="w-full max-w-6xl grid grid-cols-1 lg:grid-cols-2 overflow-hidden rounded-[2rem] auth-card">

            <div class="hidden lg:flex login-image min-h-[680px] relative items-center justify-center p-10">
                <div class="absolute inset-0 bg-gradient-to-b from-black/5 via-black/5 to-black/35"></div>

                <div class="relative z-10 w-full max-w-md text-center text-white">
                    <a href="/" class="inline-flex flex-col items-center gap-4 mb-8">
                        <div class="w-20 h-20 rounded-3xl bg-white flex items-center justify-center overflow-hidden shadow-xl shadow-black/20">
                            <img
                                src="/static/img/uksft.png"
                                alt="Logo UKS Teknik Unsoed"
                                class="w-16 h-16 object-contain"
                                onerror="this.style.display='none'; document.getElementById('fallbackLoginLogo').classList.remove('hidden');"
                            >

                            <span id="fallbackLoginLogo" class="hidden text-purple-700 font-extrabold text-xl">
                                +
                            </span>
                        </div>

                        <div>
                            <h1 class="text-xl font-extrabold leading-tight">
                                Sistem Pakar Penyakit Dada
                            </h1>
                            <p class="text-sm text-white/75 mt-1">
                                UKS Teknik Unsoed
                            </p>
                        </div>
                    </a>

                    <h2 class="text-4xl md:text-5xl font-extrabold leading-tight">
                        Masuk untuk Mengakses Sistem
                    </h2>

                </div>
            </div>

            <div class="w-full bg-white">
                <div class="min-h-[680px] flex items-center justify-center px-6 py-10">
                    <div class="w-full max-w-md">

                        <div class="lg:hidden mb-8">
                            <a href="/" class="inline-flex items-center gap-3">
                                <div class="w-12 h-12 rounded-2xl bg-white border border-slate-100 flex items-center justify-center overflow-hidden shadow-lg shadow-purple-100">
                                    <img
                                        src="/static/img/uksft.png"
                                        alt="Logo UKS Teknik Unsoed"
                                        class="w-10 h-10 object-contain"
                                        onerror="this.style.display='none'; document.getElementById('fallbackLoginLogoMobileTop').classList.remove('hidden');"
                                    >

                                    <span id="fallbackLoginLogoMobileTop" class="hidden text-purple-700 font-extrabold">
                                        +
                                    </span>
                                </div>

                                <div>
                                    <h1 class="text-base font-extrabold text-slate-950">
                                        Sistem Pakar Penyakit Dada
                                    </h1>
                                    <p class="text-xs text-slate-500">
                                        UKS Teknik Unsoed
                                    </p>
                                </div>
                            </a>
                        </div>

                        <div class="text-center mb-8">
                            <a href="/" class="inline-flex justify-center mb-5">
                                <div class="w-16 h-16 rounded-3xl bg-white border border-slate-100 flex items-center justify-center shadow-lg shadow-pink-100 overflow-hidden">
                                    <img
                                        src="/static/img/uksft.png"
                                        alt="Logo UKS Teknik Unsoed"
                                        class="w-12 h-12 object-contain"
                                        onerror="this.style.display='none'; document.getElementById('fallbackLoginLogoMobile').classList.remove('hidden');"
                                    >

                                    <span id="fallbackLoginLogoMobile" class="hidden text-sm font-extrabold text-purple-700">
                                        +
                                    </span>
                                </div>
                            </a>

                            <h1 class="text-2xl md:text-3xl font-extrabold text-slate-950">
                                Selamat Datang
                            </h1>

                            <p class="text-sm text-slate-500 mt-2">
                                Masuk untuk melanjutkan ke sistem pakar.
                            </p>
                        </div>

                        <div id="alertBox" class="hidden mb-5 rounded-xl px-4 py-3 text-sm"></div>

                        <form id="loginForm" class="space-y-5">
                            <div>
                                <label class="block text-sm font-bold text-slate-700 mb-2">
                                    Username
                                </label>

                                <div class="relative">
                                    <input
                                        type="text"
                                        id="username"
                                        class="input-modern pl-12"
                                        placeholder="Masukkan username"
                                        required
                                    >

                                    <svg class="w-5 h-5 text-slate-400 absolute left-4 top-1/2 -translate-y-1/2" fill="none" stroke="currentColor" stroke-width="1.8" viewBox="0 0 24 24">
                                        <path stroke-linecap="round" stroke-linejoin="round" d="M12 12a4 4 0 1 0 0-8 4 4 0 0 0 0 8Z" />
                                        <path stroke-linecap="round" stroke-linejoin="round" d="M4 21a8 8 0 0 1 16 0" />
                                    </svg>
                                </div>
                            </div>

                            <div>
                                <label class="block text-sm font-bold text-slate-700 mb-2">
                                    Password
                                </label>

                                <div class="relative">
                                    <input
                                        type="password"
                                        id="password"
                                        class="input-modern pl-12 pr-12"
                                        placeholder="Masukkan password"
                                        required
                                    >

                                    <svg class="w-5 h-5 text-slate-400 absolute left-4 top-1/2 -translate-y-1/2" fill="none" stroke="currentColor" stroke-width="1.8" viewBox="0 0 24 24">
                                        <path stroke-linecap="round" stroke-linejoin="round" d="M16.5 10.5V7a4.5 4.5 0 0 0-9 0v3.5" />
                                        <rect width="15" height="10" x="4.5" y="10.5" rx="2" />
                                    </svg>

                                    <button
                                        type="button"
                                        onclick="togglePassword('password', 'passwordIcon')"
                                        class="absolute right-4 top-1/2 -translate-y-1/2 text-slate-400 hover:text-purple-700 transition"
                                    >
                                        <svg id="passwordIcon" class="w-5 h-5" fill="none" stroke="currentColor" stroke-width="1.8" viewBox="0 0 24 24">
                                            <path stroke-linecap="round" stroke-linejoin="round" d="M2.25 12s3.75-7 9.75-7 9.75 7 9.75 7-3.75 7-9.75 7-9.75-7-9.75-7Z" />
                                            <circle cx="12" cy="12" r="3" />
                                        </svg>
                                    </button>
                                </div>
                            </div>

                            <button type="submit" class="w-full rounded-2xl btn-gradient py-3.5 font-extrabold">
                                Login
                            </button>
                        </form>

                        <div class="mt-6 text-center">
                            <p class="text-sm text-slate-500">
                                Belum punya akun?
                                <a href="/register-page" class="font-bold text-purple-700 hover:text-pink-600 transition">
                                    Register
                                </a>
                            </p>

                            <a href="/" class="inline-flex mt-4 text-sm font-bold text-slate-400 hover:text-purple-700 transition">
                                Kembali ke Landing Page
                            </a>
                        </div>

                    </div>
                </div>
            </div>

        </section>
    </main>

    <script>
        const loginForm = document.getElementById("loginForm");
        const alertBox = document.getElementById("alertBox");

        function showAlert(message, type = "error") {
            alertBox.classList.remove("hidden");
            alertBox.textContent = message;

            if (type === "success") {
                alertBox.className = "mb-5 rounded-xl px-4 py-3 text-sm bg-green-100 text-green-700 border border-green-200";
            } else {
                alertBox.className = "mb-5 rounded-xl px-4 py-3 text-sm bg-red-100 text-red-700 border border-red-200";
            }
        }

        function togglePassword(inputId, iconId) {
            const input = document.getElementById(inputId);
            const icon = document.getElementById(iconId);

            if (!input || !icon) return;

            if (input.type === "password") {
                input.type = "text";
                icon.innerHTML = `
                    <path stroke-linecap="round" stroke-linejoin="round" d="M3 3l18 18" />
                    <path stroke-linecap="round" stroke-linejoin="round" d="M10.6 10.6A2 2 0 0 0 13.4 13.4" />
                    <path stroke-linecap="round" stroke-linejoin="round" d="M9.88 4.24A9.3 9.3 0 0 1 12 4c6 0 9.75 8 9.75 8a16.7 16.7 0 0 1-2.2 3.22" />
                    <path stroke-linecap="round" stroke-linejoin="round" d="M6.11 6.11C3.65 7.72 2.25 12 2.25 12s3.75 8 9.75 8a9.5 9.5 0 0 0 5.08-1.48" />
                `;
            } else {
                input.type = "password";
                icon.innerHTML = `
                    <path stroke-linecap="round" stroke-linejoin="round" d="M2.25 12s3.75-7 9.75-7 9.75 7 9.75 7-3.75 7-9.75 7-9.75-7-9.75-7Z" />
                    <circle cx="12" cy="12" r="3" />
                `;
            }
        }

        loginForm.addEventListener("submit", async function(e) {
            e.preventDefault();

            const username = document.getElementById("username").value.trim();
            const password = document.getElementById("password").value.trim();

            if (!username || !password) {
                showAlert("Username dan password wajib diisi");
                return;
            }

            try {
                const response = await fetch("/login", {
                    method: "POST",
                    headers: {
                        "Content-Type": "application/json"
                    },
                    body: JSON.stringify({
                        username,
                        password
                    })
                });

                const result = await response.json();

                if (!response.ok) {
                    showAlert(result.message || "Login gagal");
                    return;
                }

                localStorage.setItem("token", result.token);
                localStorage.setItem("user", JSON.stringify(result.data));

                showAlert("Login berhasil, mengalihkan...", "success");

                setTimeout(() => {
                    if (result.data.role === "admin") {
                        window.location.href = "/admin/dashboard";
                        return;
                    }

                    window.location.href = "/user/dashboard";
                }, 800);

            } catch (error) {
                showAlert("Terjadi kesalahan koneksi ke server");
            }
        });
    </script>
</body>
</html>
